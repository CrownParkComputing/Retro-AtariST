name: Native builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: retro-atarist-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Native source audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check the native-only tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -d flutter_app
          if find . -path './.git' -prune -o -path './vendor' -prune -o \
              \( -name '*.dart' -o -name 'pubspec.yaml' -o -name 'pubspec.lock' \) \
              -print -quit | grep -q .; then
            echo '::error::A Flutter/Dart project file remains in the native application tree.'
            exit 1
          fi
          git diff --check

  android:
    name: Android native (APK + AAB)
    runs-on: ubuntu-latest
    needs: source
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install native Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build and lint native Android application
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: retro-atarist-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: retro-atarist-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS native simulator
    runs-on: macos-15
    needs: source
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          cmake --version
      - name: Build unsigned iPhone and iPad simulator application
        run: |
          ./ios/build.sh iphonesimulator \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator app and generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: retro-atarist-ios-simulator
          path: |
            ios/build/iphonesimulator/**/*.app
            ios/build/iphonesimulator/*.xcodeproj
          if-no-files-found: error
          retention-days: 14
